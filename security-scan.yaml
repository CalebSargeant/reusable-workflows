name: Security

on:
  pull_request:
    branches:
      - main
      - staging
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read
  security-events: write

jobs:
  security-scan:
    name: Security Scan
    uses: calebsargeant/reusable-workflows/.github/workflows/security-scan.yaml@v1.12.0
    with:
      job_timeout_minutes: 30
      trivy_exit_code: '1' # Blocking mode: fail job when vulnerabilities are found
      enable_sarif_upload: false # GHAS is required for this to work, otherwise it will run and just waste time
