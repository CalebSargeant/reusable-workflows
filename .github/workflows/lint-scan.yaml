name: Lint Scan

# Reusable workflow for code quality linting
# Runs best-practice checks for Dockerfiles, shell scripts, GitHub Actions workflows,
# JavaScript/TypeScript (ESLint), and Kubernetes manifests (Kustomize)
# Does not block PRs by default - use for quality feedback

on:
  workflow_call:
    inputs:
      runner:
        description: 'GitHub runner to use'
        required: false
        type: string
        default: 'ubuntu-latest'
      job_timeout_minutes:
        description: 'Maximum job runtime in minutes'
        required: false
        type: number
        default: 25
      fail_on_errors:
        description: 'Fail the workflow if lint errors are found'
        required: false
        type: boolean
        default: false
      # ESLint options
      node_version:
        description: 'Node.js version for ESLint'
        required: false
        type: string
        default: '22'
      eslint_script:
        description: 'npm script to run for linting (e.g., "lint", "eslint")'
        required: false
        type: string
        default: 'lint'
      # Kustomize options
      k8s_directory:
        description: 'Directory containing Kustomize files'
        required: false
        type: string
        default: './k8s'
      kustomize_version:
        description: 'Kustomize version to use'
        required: false
        type: string
        default: '5.8.1'
      kubernetes_version:
        description: 'Kubernetes version for validation (e.g., 1.32.0)'
        required: false
        type: string
        default: '1.32.0'
      skip_kubeconform:
        description: 'Skip kubeconform validation'
        required: false
        type: boolean
        default: false
      skip_kubescore:
        description: 'Skip kube-score validation'
        required: false
        type: boolean
        default: false
    outputs:
      lint_skipped:
        description: 'Whether lint was skipped due to no relevant changes'
        value: ${{ jobs.lint-scan.outputs.lint_skipped }}

permissions:
  contents: read
  pull-requests: read

jobs:
  lint-scan:
    name: Lint Scan
    runs-on: ${{ inputs.runner }}
    timeout-minutes: ${{ inputs.job_timeout_minutes }}
    outputs:
      lint_skipped: ${{ steps.detect.outputs.any_changed != 'true' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0

      # ============================================
      # Dynamic File Detection
      # ============================================
      - name: Detect changed files
        uses: dorny/paths-filter@de90cc6fb38fc0963ad72b210f1f284cd68cea36 # v3.0.2
        id: detect
        with:
          filters: |
            any_changed:
              - '**/*'
            javascript:
              - '**/*.js'
              - '**/*.jsx'
              - '**/*.ts'
              - '**/*.tsx'
              - '**/*.mjs'
              - '**/*.cjs'
              - 'package.json'
              - 'eslint.config.*'
              - '.eslintrc*'
            kustomize:
              - '**/k8s/**'
              - '**/kubernetes/**'
              - '**/kustomize/**'
              - '**/kustomization.yaml'
              - '**/kustomization.yml'
            dockerfile:
              - '**/Dockerfile'
              - '**/Dockerfile.*'
              - '**/*.dockerfile'
              - 'docker-compose*.yml'
              - 'docker-compose*.yaml'
            shell:
              - '**/*.sh'
              - '**/*.bash'
              - '**/*.zsh'
            workflows:
              - '.github/workflows/**'

      - name: Detection summary
        run: |
          echo "## 🔍 Detected Changes" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| File Type | Changed |" >> $GITHUB_STEP_SUMMARY
          echo "|-----------|---------|" >> $GITHUB_STEP_SUMMARY
          echo "| JavaScript/TypeScript | ${{ steps.detect.outputs.javascript }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Kustomize/K8s | ${{ steps.detect.outputs.kustomize }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Dockerfile | ${{ steps.detect.outputs.dockerfile }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Shell Scripts | ${{ steps.detect.outputs.shell }} |" >> $GITHUB_STEP_SUMMARY
          echo "| GitHub Workflows | ${{ steps.detect.outputs.workflows }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

      - name: Skip if no changes
        if: steps.detect.outputs.any_changed != 'true'
        run: |
          echo "## ⏭️ Lint Scan Skipped" >> $GITHUB_STEP_SUMMARY
          echo "No relevant file changes detected." >> $GITHUB_STEP_SUMMARY
          echo "No changes detected, skipping lint scan"

      # ============================================
      # JavaScript/TypeScript Linting (ESLint)
      # ============================================
      - name: Check for package.json
        if: steps.detect.outputs.any_changed == 'true' && steps.detect.outputs.javascript == 'true'
        id: check-package
        run: |
          if [ -f "package.json" ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            # Check if lint script exists
            if grep -q "\"${{ inputs.eslint_script }}\"" package.json; then
              echo "has_lint=true" >> "$GITHUB_OUTPUT"
            else
              echo "has_lint=false" >> "$GITHUB_OUTPUT"
              echo "::warning::No '${{ inputs.eslint_script }}' script found in package.json"
            fi
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "has_lint=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Node.js
        if: steps.detect.outputs.any_changed == 'true' && steps.detect.outputs.javascript == 'true' && steps.check-package.outputs.has_lint == 'true'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ inputs.node_version }}
          cache: 'npm'

      - name: Install dependencies
        if: steps.detect.outputs.any_changed == 'true' && steps.detect.outputs.javascript == 'true' && steps.check-package.outputs.has_lint == 'true'
        run: |
          set -euo pipefail
          if [ -f "package-lock.json" ] || [ -f "npm-shrinkwrap.json" ]; then
            INSTALL_CMD="npm ci --ignore-scripts"
          else
            INSTALL_CMD="npm install --ignore-scripts --no-audit --no-fund"
            echo "::warning::No npm lock file found. Falling back to npm install."
          fi

          for attempt in 1 2 3; do
            if $INSTALL_CMD; then
              exit 0
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "::error::Dependency installation failed after 3 attempts"
              exit 1
            fi
            sleep $((attempt * 5))
          done

      - name: Run ESLint
        id: eslint-scan
        if: steps.detect.outputs.any_changed == 'true' && steps.detect.outputs.javascript == 'true' && steps.check-package.outputs.has_lint == 'true'
        run: npm run ${{ inputs.eslint_script }}
        continue-on-error: true

      # ============================================
      # Kustomize/Kubernetes Linting
      # ============================================
      - name: Check for Kustomize files
        if: steps.detect.outputs.any_changed == 'true' && steps.detect.outputs.kustomize == 'true'
        id: check-kustomize
        run: |
          K8S_DIR="${{ inputs.k8s_directory }}"
          K8S_DIR="${K8S_DIR#./}"
          if [ -d "$K8S_DIR" ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "normalized_path=${K8S_DIR}" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Kustomize directory '${{ inputs.k8s_directory }}' not found"
          fi

      - name: Setup Kustomize
        if: steps.detect.outputs.any_changed == 'true' && steps.detect.outputs.kustomize == 'true' && steps.check-kustomize.outputs.exists == 'true'
        run: |
          set -euo pipefail
          KUSTOMIZE_VERSION="${{ inputs.kustomize_version }}"
          ARCHIVE_NAME="kustomize_v${KUSTOMIZE_VERSION}_linux_amd64.tar.gz"
          DOWNLOAD_URL="https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2Fv${KUSTOMIZE_VERSION}/${ARCHIVE_NAME}"
          echo "Installing kustomize v${KUSTOMIZE_VERSION}"

          mkdir -p "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

          for attempt in 1 2 3; do
            if curl -fsSL --retry 3 --retry-delay 2 --retry-connrefused "$DOWNLOAD_URL" -o "$ARCHIVE_NAME"; then
              break
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "::error::Failed to download kustomize after 3 attempts"
              exit 1
            fi
            sleep $((attempt * 3))
          done

          tar xzf "$ARCHIVE_NAME"
          install -m 0755 kustomize "$HOME/.local/bin/kustomize"
          rm -f "$ARCHIVE_NAME" kustomize
          kustomize version

      - name: Setup yamllint
        if: steps.detect.outputs.any_changed == 'true' && steps.detect.outputs.kustomize == 'true' && steps.check-kustomize.outputs.exists == 'true'
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if python3 -m pip install --user --disable-pip-version-check yamllint==1.35.1; then
              break
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "::error::Failed to install yamllint after 3 attempts"
              exit 1
            fi
            sleep $((attempt * 3))
          done
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Lint YAML files
        id: yamllint-scan
        if: steps.detect.outputs.any_changed == 'true' && steps.detect.outputs.kustomize == 'true' && steps.check-kustomize.outputs.exists == 'true'
        run: |
          yamllint "${{ inputs.k8s_directory }}/" || echo "::warning::YAML linting found issues"
        continue-on-error: true

      - name: Build Kustomize manifests
        if: steps.detect.outputs.any_changed == 'true' && steps.detect.outputs.kustomize == 'true' && steps.check-kustomize.outputs.exists == 'true'
        id: kustomize-build
        run: |
          set -euo pipefail
          : > rendered-manifests.yaml
          mapfile -t kustomization_files < <(find "${{ inputs.k8s_directory }}" \( -name 'kustomization.yaml' -o -name 'kustomization.yml' \))

          if [ "${#kustomization_files[@]}" -eq 0 ]; then
            echo "::warning::No kustomization files found in ${{ inputs.k8s_directory }}"
            rm -f rendered-manifests.yaml
            exit 0
          fi

          for kustomization_file in "${kustomization_files[@]}"; do
            kustomization_dir=$(dirname "$kustomization_file")
            echo "Building Kustomize in: $kustomization_dir"
            kustomize build "$kustomization_dir" >> rendered-manifests.yaml
            echo "---" >> rendered-manifests.yaml
          done

          if [ ! -s rendered-manifests.yaml ]; then
            echo "::warning::No Kustomize manifests were built"
            exit 0
          fi
          echo "Successfully built Kustomize manifests"
        continue-on-error: true

      - name: Validate with kubeconform
        id: kubeconform-scan
        if: steps.detect.outputs.any_changed == 'true' && steps.detect.outputs.kustomize == 'true' && steps.check-kustomize.outputs.exists == 'true' && !inputs.skip_kubeconform
        run: |
          if [ -f rendered-manifests.yaml ]; then
            cat rendered-manifests.yaml | docker run --rm -i \
              ghcr.io/yannh/kubeconform:v0.6.7-alpine \
              -strict \
              -summary \
              -kubernetes-version ${{ inputs.kubernetes_version }}
          fi
        continue-on-error: true

      - name: Validate with kube-score
        id: kubescore-scan
        if: steps.detect.outputs.any_changed == 'true' && steps.detect.outputs.kustomize == 'true' && steps.check-kustomize.outputs.exists == 'true' && !inputs.skip_kubescore
        run: |
          if [ -f rendered-manifests.yaml ]; then
            K8S_VERSION_SHORT=$(echo "${{ inputs.kubernetes_version }}" | cut -d. -f1-2)
            if [[ ! "$K8S_VERSION_SHORT" =~ ^v ]]; then
              K8S_VERSION_SHORT="v${K8S_VERSION_SHORT}"
            fi
            cat rendered-manifests.yaml | docker run --rm -i \
              zegl/kube-score:v1.19.0 \
              score - \
              --kubernetes-version "$K8S_VERSION_SHORT" \
              --color always || echo "::warning::kube-score found issues"
          fi
        continue-on-error: true

      # ============================================
      # Dockerfile Linting (Hadolint)
      # ============================================
      - name: Run Hadolint (Dockerfile detected)
        id: hadolint-scan
        if: steps.detect.outputs.any_changed == 'true' && steps.detect.outputs.dockerfile == 'true'
        uses: hadolint/hadolint-action@54c9adbab1582c2ef04b2016b760714a4bfde3cf # v3.1.0
        with:
          dockerfile: "Dockerfile"
          recursive: true
          failure-threshold: error
        continue-on-error: true

      # ============================================
      # Shell Script Linting (ShellCheck)
      # ============================================
      - name: Run ShellCheck (shell scripts detected)
        id: shellcheck-scan
        if: steps.detect.outputs.any_changed == 'true' && steps.detect.outputs.shell == 'true'
        uses: ludeeus/action-shellcheck@00cae500b08a931fb5698e11e79bfbd38e612a38 # 2.0.0
        with:
          severity: warning
          scandir: '.'
        continue-on-error: true

      # ============================================
      # GitHub Actions Linting (Actionlint)
      # ============================================
      - name: Run Actionlint (workflows detected)
        id: actionlint-scan
        if: steps.detect.outputs.any_changed == 'true' && steps.detect.outputs.workflows == 'true'
        uses: reviewdog/action-actionlint@e58ee9d111489c31395fbe4857b0be6e7635dbda # v1.70.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          reporter: ${{ github.event_name == 'pull_request' && 'github-pr-review' || 'github-check' }}
          fail_on_error: true
        continue-on-error: true

      # ============================================
      # Reporting and Final Status
      # ============================================
      - name: Build lint scan report
        id: lint-report
        if: steps.detect.outputs.any_changed == 'true' && always()
        run: |
          set -eo pipefail
          FAILED=false
          BLOCKING_FAILED=()
          ADVISORY_FAILED=()

          to_result() {
            case "$1" in
              success) echo "✅ Passed" ;;
              failure) echo "❌ Failed" ;;
              skipped) echo "⏭️ Skipped" ;;
              cancelled) echo "⚪ Cancelled" ;;
              *) echo "⚠️ ${1:-unknown}" ;;
            esac
          }

          add_row() {
            echo "| $1 | $2 | $3 | $4 |" >> "$GITHUB_STEP_SUMMARY"
          }

          mark_blocking_failure() {
            if [ "$1" = "failure" ]; then
              FAILED=true
              BLOCKING_FAILED+=("$2")
            fi
          }

          mark_advisory_failure() {
            if [ "$1" = "failure" ]; then
              ADVISORY_FAILED+=("$2")
            fi
          }

          echo "## 🧹 Lint Scan Report" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          if [ "${{ inputs.fail_on_errors }}" = "true" ]; then
            echo "**Mode:** Blocking (`fail_on_errors=true`)" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "**Mode:** Advisory (`fail_on_errors=false`)" >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Check | Trigger | Result | Notes |" >> "$GITHUB_STEP_SUMMARY"
          echo "|-------|---------|--------|-------|" >> "$GITHUB_STEP_SUMMARY"

          if [ "${{ steps.detect.outputs.javascript }}" = "true" ]; then
            if [ "${{ steps.check-package.outputs.has_lint }}" = "true" ]; then
              ESLINT_OUTCOME="${{ steps.eslint-scan.outcome }}"
              add_row "ESLint" "JS/TS changes + lint script present" "$(to_result "$ESLINT_OUTCOME")" "npm run ${{ inputs.eslint_script }}"
              mark_blocking_failure "$ESLINT_OUTCOME" "ESLint"
            else
              add_row "ESLint" "JS/TS changes + lint script present" "⏭️ Not triggered" "No '${{ inputs.eslint_script }}' script in package.json"
            fi
          else
            add_row "ESLint" "JS/TS changes + lint script present" "⏭️ Not triggered" "No JavaScript/TypeScript changes detected"
          fi

          if [ "${{ steps.detect.outputs.kustomize }}" = "true" ] && [ "${{ steps.check-kustomize.outputs.exists }}" = "true" ]; then
            YAMLLINT_OUTCOME="${{ steps.yamllint-scan.outcome }}"
            add_row "yamllint" "K8s files changed + K8s directory exists" "$(to_result "$YAMLLINT_OUTCOME")" "Advisory check"
            mark_advisory_failure "$YAMLLINT_OUTCOME" "yamllint"

            KUSTOMIZE_BUILD_OUTCOME="${{ steps.kustomize-build.outcome }}"
            add_row "Kustomize build" "K8s files changed + K8s directory exists" "$(to_result "$KUSTOMIZE_BUILD_OUTCOME")" "Build rendered manifests"
            mark_blocking_failure "$KUSTOMIZE_BUILD_OUTCOME" "Kustomize build"

            if [ "${{ inputs.skip_kubeconform }}" = "true" ]; then
              add_row "kubeconform" "K8s files changed + K8s directory exists" "⏭️ Disabled" "skip_kubeconform=true"
            else
              KUBECONFORM_OUTCOME="${{ steps.kubeconform-scan.outcome }}"
              add_row "kubeconform" "K8s files changed + K8s directory exists" "$(to_result "$KUBECONFORM_OUTCOME")" "Kubernetes schema validation"
              mark_blocking_failure "$KUBECONFORM_OUTCOME" "kubeconform"
            fi

            if [ "${{ inputs.skip_kubescore }}" = "true" ]; then
              add_row "kube-score" "K8s files changed + K8s directory exists" "⏭️ Disabled" "skip_kubescore=true"
            else
              KUBESCORE_OUTCOME="${{ steps.kubescore-scan.outcome }}"
              add_row "kube-score" "K8s files changed + K8s directory exists" "$(to_result "$KUBESCORE_OUTCOME")" "Advisory best-practice check"
              mark_advisory_failure "$KUBESCORE_OUTCOME" "kube-score"
            fi
          elif [ "${{ steps.detect.outputs.kustomize }}" = "true" ] && [ "${{ steps.check-kustomize.outputs.exists }}" != "true" ]; then
            add_row "yamllint" "K8s files changed + K8s directory exists" "⏭️ Not triggered" "Directory '${{ inputs.k8s_directory }}' not found"
            add_row "Kustomize build" "K8s files changed + K8s directory exists" "⏭️ Not triggered" "Directory '${{ inputs.k8s_directory }}' not found"
            if [ "${{ inputs.skip_kubeconform }}" = "true" ]; then
              add_row "kubeconform" "K8s files changed + K8s directory exists" "⏭️ Disabled" "skip_kubeconform=true"
            else
              add_row "kubeconform" "K8s files changed + K8s directory exists" "⏭️ Not triggered" "Directory '${{ inputs.k8s_directory }}' not found"
            fi
            if [ "${{ inputs.skip_kubescore }}" = "true" ]; then
              add_row "kube-score" "K8s files changed + K8s directory exists" "⏭️ Disabled" "skip_kubescore=true"
            else
              add_row "kube-score" "K8s files changed + K8s directory exists" "⏭️ Not triggered" "Directory '${{ inputs.k8s_directory }}' not found"
            fi
          else
            add_row "yamllint" "K8s files changed + K8s directory exists" "⏭️ Not triggered" "No K8s/Kustomize changes detected"
            add_row "Kustomize build" "K8s files changed + K8s directory exists" "⏭️ Not triggered" "No K8s/Kustomize changes detected"
            if [ "${{ inputs.skip_kubeconform }}" = "true" ]; then
              add_row "kubeconform" "K8s files changed + K8s directory exists" "⏭️ Disabled" "skip_kubeconform=true"
            else
              add_row "kubeconform" "K8s files changed + K8s directory exists" "⏭️ Not triggered" "No K8s/Kustomize changes detected"
            fi
            if [ "${{ inputs.skip_kubescore }}" = "true" ]; then
              add_row "kube-score" "K8s files changed + K8s directory exists" "⏭️ Disabled" "skip_kubescore=true"
            else
              add_row "kube-score" "K8s files changed + K8s directory exists" "⏭️ Not triggered" "No K8s/Kustomize changes detected"
            fi
          fi

          if [ "${{ steps.detect.outputs.dockerfile }}" = "true" ]; then
            HADOLINT_OUTCOME="${{ steps.hadolint-scan.outcome }}"
            add_row "Hadolint" "Dockerfile changes detected" "$(to_result "$HADOLINT_OUTCOME")" "Dockerfile lint rules"
            mark_blocking_failure "$HADOLINT_OUTCOME" "Hadolint"
          else
            add_row "Hadolint" "Dockerfile changes detected" "⏭️ Not triggered" "No Dockerfile changes detected"
          fi

          if [ "${{ steps.detect.outputs.shell }}" = "true" ]; then
            SHELLCHECK_OUTCOME="${{ steps.shellcheck-scan.outcome }}"
            add_row "ShellCheck" "Shell script changes detected" "$(to_result "$SHELLCHECK_OUTCOME")" "Shell script lint rules"
            mark_blocking_failure "$SHELLCHECK_OUTCOME" "ShellCheck"
          else
            add_row "ShellCheck" "Shell script changes detected" "⏭️ Not triggered" "No shell script changes detected"
          fi

          if [ "${{ steps.detect.outputs.workflows }}" = "true" ]; then
            ACTIONLINT_OUTCOME="${{ steps.actionlint-scan.outcome }}"
            add_row "Actionlint" "Workflow file changes detected" "$(to_result "$ACTIONLINT_OUTCOME")" "GitHub Actions workflow lint rules"
            mark_blocking_failure "$ACTIONLINT_OUTCOME" "Actionlint"
          else
            add_row "Actionlint" "Workflow file changes detected" "⏭️ Not triggered" "No workflow changes detected"
          fi

          echo "" >> "$GITHUB_STEP_SUMMARY"
          if [ "${#BLOCKING_FAILED[@]}" -gt 0 ]; then
            BLOCKING_JOINED="$(printf '%s, ' "${BLOCKING_FAILED[@]}")"
            BLOCKING_JOINED="${BLOCKING_JOINED%, }"
            echo "### ❌ Blocking check failures" >> "$GITHUB_STEP_SUMMARY"
            for check in "${BLOCKING_FAILED[@]}"; do
              echo "- $check" >> "$GITHUB_STEP_SUMMARY"
            done
            echo "has_blocking_failures=true" >> "$GITHUB_OUTPUT"
            echo "blocking_failures=$BLOCKING_JOINED" >> "$GITHUB_OUTPUT"
          else
            echo "✅ No blocking lint failures found." >> "$GITHUB_STEP_SUMMARY"
            echo "has_blocking_failures=false" >> "$GITHUB_OUTPUT"
            echo "blocking_failures=" >> "$GITHUB_OUTPUT"
          fi

          if [ "${#ADVISORY_FAILED[@]}" -gt 0 ]; then
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "### ⚠️ Advisory check issues" >> "$GITHUB_STEP_SUMMARY"
            for check in "${ADVISORY_FAILED[@]}"; do
              echo "- $check" >> "$GITHUB_STEP_SUMMARY"
            done
          fi

          if [ "${{ inputs.fail_on_errors }}" = "true" ] && [ "$FAILED" = "true" ]; then
            echo "should_fail=true" >> "$GITHUB_OUTPUT"
          else
            echo "should_fail=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Fail job if lint errors found in blocking mode
        if: steps.detect.outputs.any_changed == 'true' && always()
        run: |
          if [ "${{ steps.lint-report.outputs.should_fail }}" = "true" ]; then
            echo "⚠️ Lint checks failed: ${{ steps.lint-report.outputs.blocking_failures }}"
            exit 1
          fi
          if [ "${{ steps.lint-report.outputs.has_blocking_failures }}" = "true" ]; then
            echo "ℹ️ Lint issues detected, but workflow is in advisory mode."
          else
            echo "✅ Lint checks passed"
          fi

