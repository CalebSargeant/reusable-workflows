name: Security Scan

# Minimal security scanning workflow with dynamic language detection
# Only runs the scans needed based on what files changed
# Fast by default - enable additional scans in caller workflow if needed

on:
  workflow_call:
    inputs:
      runner:
        description: 'GitHub runner to use'
        required: false
        type: string
        default: 'ubuntu-latest'
      job_timeout_minutes:
        description: 'Maximum job runtime in minutes'
        required: false
        type: number
        default: 30
      trivy_severity:
        description: 'Trivy severity levels to scan for'
        required: false
        type: string
        default: 'CRITICAL,HIGH'
      trivy_exit_code:
        description: 'Exit code when vulnerabilities are found (1 = fail, 0 = warn only)'
        required: false
        type: string
        default: '1'
      trivy_ignore_unfixed:
        description: 'Ignore unfixed vulnerabilities'
        required: false
        type: boolean
        default: true
      trivy_version:
        description: 'Trivy version to use'
        required: false
        type: string
        default: 'v0.69.3'
      trivyignore_file:
        description: 'Path to trivyignore file for whitelisting known CVEs (only used if file exists)'
        required: false
        type: string
        default: '.trivyignore'
      trufflehog_exclude:
        description: 'Path to exclude file for ignoring known secrets (gitignore-style patterns)'
        required: false
        type: string
        default: ''
      semgrep_baseline:
        description: 'Path to semgrep baseline file (.semgrepignore) for ignoring known issues'
        required: false
        type: string
        default: ''
      # Optional scanners - disabled by default, caller must enable
      enable_sast:
        description: 'Enable Semgrep SAST scanning'
        required: false
        type: boolean
        default: true
      enable_license_scan:
        description: 'Enable license compliance scanning'
        required: false
        type: boolean
        default: false
      semgrep_config:
        description: 'Semgrep rules configuration'
        required: false
        type: string
        default: 'p/default p/security-audit p/secrets'
      checkov_skip_checks:
        description: 'Checkov checks to skip (comma-separated)'
        required: false
        type: string
        default: ''
      enable_sarif_upload:
        description: 'Enable SARIF upload to GitHub Security tab (requires GitHub Advanced Security, which is a paid feature for private repos)'
        required: false
        type: boolean
        default: true
    outputs:
      scan_skipped:
        description: 'Whether the scan was skipped due to no relevant changes'
        value: ${{ jobs.security-scan.outputs.scan_skipped }}

permissions:
  contents: read
  pull-requests: read
  security-events: write

jobs:
  security-scan:
    name: Security Scan
    runs-on: ${{ inputs.runner }}
    timeout-minutes: ${{ inputs.job_timeout_minutes }}
    outputs:
      scan_skipped: ${{ steps.detect.outputs.any_changed != 'true' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0

      # ============================================
      # Dynamic Language/File Detection
      # ============================================
      - name: Detect changed files and languages
        uses: dorny/paths-filter@de90cc6fb38fc0963ad72b210f1f284cd68cea36 # v3.0.2
        id: detect
        with:
          filters: |
            any_changed:
              - '**/*'
            python:
              - '**/*.py'
              - 'requirements.txt'
              - 'pyproject.toml'
              - 'poetry.lock'
              - 'Pipfile'
              - 'Pipfile.lock'
              - 'setup.py'
              - 'setup.cfg'
            go:
              - '**/*.go'
              - 'go.mod'
              - 'go.sum'
            javascript:
              - '**/*.js'
              - '**/*.jsx'
              - '**/*.ts'
              - '**/*.tsx'
              - '**/*.mjs'
              - '**/*.cjs'
              - 'package.json'
              - 'package-lock.json'
              - 'yarn.lock'
              - 'pnpm-lock.yaml'
            iac:
              - '**/*.tf'
              - '**/*.tfvars'
              - '**/*.hcl'
              - '**/k8s/**'
              - '**/kubernetes/**'
              - '**/kustomize/**'
              - '**/helm/**'
              - '**/*.yaml'
              - '**/*.yml'

      - name: Detection summary
        run: |
          echo "## 🔍 Detected Changes" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Language/Type | Changed |" >> $GITHUB_STEP_SUMMARY
          echo "|---------------|---------|" >> $GITHUB_STEP_SUMMARY
          echo "| Python | ${{ steps.detect.outputs.python }} |" >> $GITHUB_STEP_SUMMARY
          echo "| JavaScript/TypeScript | ${{ steps.detect.outputs.javascript }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Go | ${{ steps.detect.outputs.go }} |" >> $GITHUB_STEP_SUMMARY
          echo "| IaC (Terraform/K8s) | ${{ steps.detect.outputs.iac }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

      - name: Skip if no changes
        if: steps.detect.outputs.any_changed != 'true'
        run: |
          echo "## ⏭️ Security Scan Skipped" >> $GITHUB_STEP_SUMMARY
          echo "No relevant file changes detected." >> $GITHUB_STEP_SUMMARY
          echo "No changes detected, skipping security scan"

      # ============================================
      # CORE: Trivy Vulnerability Scan (always runs)
      # ============================================
      - name: Check for trivyignore file
        id: trivyignore
        run: |
          if [ -f "${{ inputs.trivyignore_file }}" ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Found ${{ inputs.trivyignore_file }}"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "No ${{ inputs.trivyignore_file }} found, skipping ignore file"
          fi
      - name: Install Trivy CLI
        id: trivy-install
        if: steps.detect.outputs.any_changed == 'true'
        run: |
          set -euo pipefail
          REQUESTED_TRIVY_VERSION="${{ inputs.trivy_version }}"
          INSTALL_SCRIPT="${RUNNER_TEMP}/install-trivy.sh"
          INSTALL_MODE="requested"

          mkdir -p "$HOME/.local/bin"

          for attempt in 1 2 3; do
            if curl -fsSL --retry 3 --retry-delay 2 --retry-connrefused "https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh" -o "$INSTALL_SCRIPT"; then
              break
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "::error::Failed to download Trivy installer script after 3 attempts"
              exit 1
            fi
            sleep $((attempt * 3))
          done
          chmod +x "$INSTALL_SCRIPT"

          if ! bash "$INSTALL_SCRIPT" -b "$HOME/.local/bin" "$REQUESTED_TRIVY_VERSION"; then
            echo "::warning::Failed to install requested Trivy version '$REQUESTED_TRIVY_VERSION'. Falling back to latest."
            if ! bash "$INSTALL_SCRIPT" -b "$HOME/.local/bin" latest; then
              echo "::error::Failed to install Trivy using requested version and fallback latest."
              exit 1
            fi
            INSTALL_MODE="fallback_latest"
          fi
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          TRIVY_VERSION_OUTPUT="$("$HOME/.local/bin/trivy" --version)"
          TRIVY_VERSION_OUTPUT="${TRIVY_VERSION_OUTPUT%%$'\n'*}"
          echo "install_mode=$INSTALL_MODE" >> "$GITHUB_OUTPUT"
          echo "resolved_version=$TRIVY_VERSION_OUTPUT" >> "$GITHUB_OUTPUT"
          echo "$TRIVY_VERSION_OUTPUT"
        continue-on-error: true

      - name: Run Trivy vulnerability scanner
        id: trivy-scan
        if: steps.detect.outputs.any_changed == 'true' && steps.trivy-install.outcome != 'failure'
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # 0.35.0
        with:
          version: ${{ inputs.trivy_version }}
          scan-type: 'fs'
          scan-ref: '.'
          scanners: 'vuln'
          severity: ${{ inputs.trivy_severity }}
          exit-code: ${{ inputs.trivy_exit_code }}
          ignore-unfixed: ${{ inputs.trivy_ignore_unfixed }}
          skip-dirs: 'node_modules,.git,vendor'
          trivyignores: ${{ steps.trivyignore.outputs.exists == 'true' && inputs.trivyignore_file || '' }}
          format: 'table'
          timeout: '10m0s'
          skip-setup-trivy: true
        continue-on-error: true

      - name: Trivy SARIF output
        if: steps.detect.outputs.any_changed == 'true' && inputs.enable_sarif_upload && steps.trivy-install.outcome != 'failure' && always()
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # 0.35.0
        with:
          version: ${{ inputs.trivy_version }}
          scan-type: 'fs'
          scan-ref: '.'
          scanners: 'vuln'
          severity: ${{ inputs.trivy_severity }}
          exit-code: '0'
          ignore-unfixed: ${{ inputs.trivy_ignore_unfixed }}
          skip-dirs: 'node_modules,.git,vendor'
          trivyignores: ${{ steps.trivyignore.outputs.exists == 'true' && inputs.trivyignore_file || '' }}
          format: 'sarif'
          output: 'trivy-results.sarif'
          timeout: '10m0s'
          skip-setup-trivy: true
        continue-on-error: true

      - name: Upload Trivy SARIF
        if: steps.detect.outputs.any_changed == 'true' && inputs.enable_sarif_upload && steps.trivy-install.outcome != 'failure' && always()
        uses: github/codeql-action/upload-sarif@f5c2471be782132e47a6e6f9c725e56730d6e9a3 # v3.32.3
        with:
          sarif_file: 'trivy-results.sarif'
          category: 'trivy'
        continue-on-error: true

      # ============================================
      # CORE: TruffleHog Secret Detection (always runs)
      # ============================================
      - name: Check for TruffleHog exclude file
        id: trufflehog-baseline
        run: |
          if [ -n "${{ inputs.trufflehog_exclude }}" ] && [ -f "${{ inputs.trufflehog_exclude }}" ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Found ${{ inputs.trufflehog_exclude }}"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Run TruffleHog secret detection
        id: trufflehog-scan
        if: steps.detect.outputs.any_changed == 'true'
        uses: trufflesecurity/trufflehog@6961f2bace57ab32b23b3ba40f8f420f6bc7e004 # v3.93.3
        with:
          extra_args: --only-verified ${{ steps.trufflehog-baseline.outputs.exists == 'true' && format('--exclude-paths={0}', inputs.trufflehog_exclude) || '' }}
        continue-on-error: true

      # ============================================
      # DYNAMIC: Python Security (pip-audit)
      # ============================================
      - name: Run pip-audit (Python detected)
        id: pip-audit-scan
        if: steps.detect.outputs.any_changed == 'true' && steps.detect.outputs.python == 'true'
        uses: pypa/gh-action-pip-audit@1220774d901786e6f652ae159f7b6bc8fea6d266 # v1.1.0
        with:
          vulnerability-service: osv
        continue-on-error: true

      # ============================================
      # DYNAMIC: JavaScript/Node.js Security (npm audit)
      # ============================================
      - name: Setup Node.js
        if: steps.detect.outputs.any_changed == 'true' && steps.detect.outputs.javascript == 'true'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 'lts/*'

      - name: Run npm audit (JavaScript detected)
        id: npm-audit-scan
        if: steps.detect.outputs.any_changed == 'true' && steps.detect.outputs.javascript == 'true'
        run: |
          if [ -f "package-lock.json" ]; then
            echo "Running npm audit..."
            npm audit --audit-level=high
          elif [ -f "yarn.lock" ]; then
            echo "Running yarn audit..."
            corepack enable
            corepack yarn audit --level high
          elif [ -f "pnpm-lock.yaml" ]; then
            echo "Running pnpm audit..."
            corepack enable
            corepack pnpm audit --audit-level high
          else
            echo "No lock file found, skipping audit"
          fi
        continue-on-error: true

      # ============================================
      # DYNAMIC: Go Security (govulncheck)
      # ============================================
      - name: Setup Go
        if: steps.detect.outputs.any_changed == 'true' && steps.detect.outputs.go == 'true'
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: 'stable'
          cache: false

      - name: Run govulncheck (Go detected)
        id: govulncheck-scan
        if: steps.detect.outputs.any_changed == 'true' && steps.detect.outputs.go == 'true'
        uses: golang/govulncheck-action@b625fbe08f3bccbe446d94fbf87fcc875a4f50ee # v1.0.4
        with:
          go-version-input: 'stable'
          check-latest: true
        continue-on-error: true

      # ============================================
      # CORE: Semgrep SAST (enabled by default)
      # ============================================
      - name: Check for Semgrep ignore file
        id: semgrep-baseline-check
        if: steps.detect.outputs.any_changed == 'true' && inputs.enable_sast
        run: |
          if [ -n "${{ inputs.semgrep_baseline }}" ] && [ -f "${{ inputs.semgrep_baseline }}" ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "file=${{ inputs.semgrep_baseline }}" >> "$GITHUB_OUTPUT"
            echo "Found ${{ inputs.semgrep_baseline }}"
          elif [ -f ".semgrepignore" ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "file=.semgrepignore" >> "$GITHUB_OUTPUT"
            echo "Found .semgrepignore"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Setup Semgrep
        if: steps.detect.outputs.any_changed == 'true' && inputs.enable_sast
        run: pip3 install semgrep==${{ env.SEMGREP_VERSION }}
        env:
          SEMGREP_VERSION: '1.151.0'

      - name: Run Semgrep SAST
        id: semgrep-scan
        if: steps.detect.outputs.any_changed == 'true' && inputs.enable_sast
        run: |
          set -eo pipefail

          CONFIG_ARGS=()
          for config in ${{ inputs.semgrep_config }}; do
            CONFIG_ARGS+=(--config "$config")
          done

          EXCLUDE_ARGS=()
          if [ "${{ steps.semgrep-baseline-check.outputs.exists }}" = "true" ]; then
            while IFS= read -r pattern || [ -n "$pattern" ]; do
              pattern="${pattern#"${pattern%%[![:space:]]*}"}"
              pattern="${pattern%"${pattern##*[![:space:]]}"}"
              if [ -z "$pattern" ] || [[ "$pattern" == \#* ]]; then
                continue
              fi
              EXCLUDE_ARGS+=(--exclude "$pattern")
            done < "${{ steps.semgrep-baseline-check.outputs.file }}"
          fi

          exit_code=0
          semgrep scan --sarif "${CONFIG_ARGS[@]}" "${EXCLUDE_ARGS[@]}" --output semgrep.sarif || exit_code=$?
          # Semgrep exit codes: 0=no findings, 1=findings, 2+=error
          # We only fail on findings (exit 1), not on errors (exit 2+)
          if [ "$exit_code" -eq 1 ]; then
            exit 1
          elif [ "$exit_code" -gt 1 ]; then
            echo "⚠️ Semgrep encountered an error (exit code $exit_code) but continuing"
            exit 0
          fi
        continue-on-error: true

      - name: Upload Semgrep SARIF
        if: steps.detect.outputs.any_changed == 'true' && inputs.enable_sast && inputs.enable_sarif_upload && always()
        uses: github/codeql-action/upload-sarif@f5c2471be782132e47a6e6f9c725e56730d6e9a3 # v3.32.3
        with:
          sarif_file: 'semgrep.sarif'
          category: 'semgrep'
        continue-on-error: true

      # ============================================
      # DYNAMIC: Checkov IaC Scan (Terraform/K8s/Docker)
      # ============================================
      - name: Check for Checkov config file
        id: checkov-config
        run: |
          if [ -f ".checkov.yaml" ] || [ -f ".checkov.yml" ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            if [ -f ".checkov.yaml" ]; then
              echo "file=.checkov.yaml" >> "$GITHUB_OUTPUT"
              echo "Found .checkov.yaml"
            else
              echo "file=.checkov.yml" >> "$GITHUB_OUTPUT"
              echo "Found .checkov.yml"
            fi
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "No Checkov config file found"
          fi

      - name: Run Checkov IaC scan (IaC detected)
        id: checkov-scan
        if: steps.detect.outputs.any_changed == 'true' && steps.detect.outputs.iac == 'true'
        uses: bridgecrewio/checkov-action@b3c44b4437c93549fc8cfaef9208497ba4955d39 # v12.3081.0
        with:
          directory: .
          framework: all
          config_file: ${{ steps.checkov-config.outputs.exists == 'true' && steps.checkov-config.outputs.file || '' }}
          skip_check: ${{ inputs.checkov_skip_checks }}
          output_format: ${{ inputs.enable_sarif_upload && 'sarif' || 'cli' }}
          output_file_path: ${{ inputs.enable_sarif_upload && 'checkov-results.sarif' || '' }}
          soft_fail: false
        continue-on-error: true

      - name: Upload Checkov SARIF
        if: steps.detect.outputs.any_changed == 'true' && steps.detect.outputs.iac == 'true' && inputs.enable_sarif_upload && always()
        uses: github/codeql-action/upload-sarif@f5c2471be782132e47a6e6f9c725e56730d6e9a3 # v3.32.3
        with:
          sarif_file: 'checkov-results.sarif'
          category: 'checkov'
        continue-on-error: true

      # ============================================
      # OPTIONAL: License Compliance (caller must enable)
      # ============================================
      - name: Run license scan
        id: license-scan
        if: steps.detect.outputs.any_changed == 'true' && inputs.enable_license_scan && steps.trivy-install.outcome != 'failure'
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # 0.35.0
        with:
          version: ${{ inputs.trivy_version }}
          scan-type: 'fs'
          scan-ref: '.'
          scanners: 'license'
          exit-code: '1'
          severity: 'UNKNOWN,HIGH,CRITICAL'
          timeout: '10m0s'
          skip-setup-trivy: true
        continue-on-error: true

      # ============================================
      # Reporting and Final Status
      # ============================================
      - name: Build security scan report
        id: security-report
        if: steps.detect.outputs.any_changed == 'true' && always()
        run: |
          FAILED=false
          FAILED_SCANS=()

          to_result() {
            case "$1" in
              success) echo "✅ Passed" ;;
              failure) echo "❌ Failed" ;;
              skipped) echo "⏭️ Skipped" ;;
              cancelled) echo "⚪ Cancelled" ;;
              *) echo "⚠️ ${1:-unknown}" ;;
            esac
          }

          add_row() {
            echo "| $1 | $2 | $3 | $4 |" >> "$GITHUB_STEP_SUMMARY"
          }

          mark_failure() {
            if [ "$1" = "failure" ]; then
              FAILED=true
              FAILED_SCANS+=("$2")
            fi
          }

          echo "## 🔒 Security Scan Report" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Scanner | Trigger | Result | Notes |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---------|---------|--------|-------|" >> "$GITHUB_STEP_SUMMARY"
          TRIVY_INSTALL_OUTCOME="${{ steps.trivy-install.outcome }}"
          TRIVY_INSTALL_NOTES="Requested: ${{ inputs.trivy_version }}"
          if [ "$TRIVY_INSTALL_OUTCOME" = "success" ]; then
            TRIVY_INSTALL_NOTES="$TRIVY_INSTALL_NOTES, Installed: ${{ steps.trivy-install.outputs.resolved_version }}, Mode: ${{ steps.trivy-install.outputs.install_mode }}"
          fi
          add_row "Trivy CLI install" "Always" "$(to_result "$TRIVY_INSTALL_OUTCOME")" "$TRIVY_INSTALL_NOTES"
          mark_failure "$TRIVY_INSTALL_OUTCOME" "Trivy CLI install"

          if [ "$TRIVY_INSTALL_OUTCOME" = "failure" ]; then
            add_row "Trivy vulnerability scan" "Always" "⏭️ Skipped" "Skipped because Trivy installation failed"
          else
            TRIVY_OUTCOME="${{ steps.trivy-scan.outcome }}"
            add_row "Trivy vulnerability scan" "Always" "$(to_result "$TRIVY_OUTCOME")" "Severity: ${{ inputs.trivy_severity }}"
            mark_failure "$TRIVY_OUTCOME" "Trivy vulnerability scan"
          fi
          mark_failure "$TRIVY_OUTCOME" "Trivy vulnerability scan"

          TRUFFLEHOG_OUTCOME="${{ steps.trufflehog-scan.outcome }}"
          add_row "TruffleHog secret detection" "Always" "$(to_result "$TRUFFLEHOG_OUTCOME")" "--only-verified mode"
          mark_failure "$TRUFFLEHOG_OUTCOME" "TruffleHog secret detection"

          if [ "${{ inputs.enable_sast }}" = "true" ]; then
            SEMGREP_OUTCOME="${{ steps.semgrep-scan.outcome }}"
            SEMGREP_NOTES="Config: ${{ inputs.semgrep_config }}"
            if [ "${{ steps.semgrep-baseline-check.outputs.exists }}" = "true" ]; then
              SEMGREP_NOTES="$SEMGREP_NOTES, ignore file: ${{ steps.semgrep-baseline-check.outputs.file }}"
            fi
            add_row "Semgrep SAST" "Enabled by input" "$(to_result "$SEMGREP_OUTCOME")" "$SEMGREP_NOTES"
            mark_failure "$SEMGREP_OUTCOME" "Semgrep SAST"
          else
            add_row "Semgrep SAST" "Enabled by input" "⏭️ Disabled" "enable_sast=false"
          fi

          if [ "${{ steps.detect.outputs.python }}" = "true" ]; then
            PIP_AUDIT_OUTCOME="${{ steps.pip-audit-scan.outcome }}"
            add_row "pip-audit" "Python files changed" "$(to_result "$PIP_AUDIT_OUTCOME")" "OSV database"
            mark_failure "$PIP_AUDIT_OUTCOME" "pip-audit"
          else
            add_row "pip-audit" "Python files changed" "⏭️ Not triggered" "No Python changes detected"
          fi

          if [ "${{ steps.detect.outputs.javascript }}" = "true" ]; then
            NPM_AUDIT_OUTCOME="${{ steps.npm-audit-scan.outcome }}"
            add_row "npm/yarn/pnpm audit" "JavaScript files changed" "$(to_result "$NPM_AUDIT_OUTCOME")" "Runs based on detected lockfile"
            mark_failure "$NPM_AUDIT_OUTCOME" "npm/yarn/pnpm audit"
          else
            add_row "npm/yarn/pnpm audit" "JavaScript files changed" "⏭️ Not triggered" "No JavaScript changes detected"
          fi

          if [ "${{ steps.detect.outputs.go }}" = "true" ]; then
            GOVULNCHECK_OUTCOME="${{ steps.govulncheck-scan.outcome }}"
            add_row "govulncheck" "Go files changed" "$(to_result "$GOVULNCHECK_OUTCOME")" "Go vulnerability database"
            mark_failure "$GOVULNCHECK_OUTCOME" "govulncheck"
          else
            add_row "govulncheck" "Go files changed" "⏭️ Not triggered" "No Go changes detected"
          fi

          if [ "${{ steps.detect.outputs.iac }}" = "true" ]; then
            CHECKOV_OUTCOME="${{ steps.checkov-scan.outcome }}"
            add_row "Checkov IaC scan" "IaC files changed" "$(to_result "$CHECKOV_OUTCOME")" "Framework: all"
            mark_failure "$CHECKOV_OUTCOME" "Checkov IaC scan"
          else
            add_row "Checkov IaC scan" "IaC files changed" "⏭️ Not triggered" "No IaC changes detected"
          fi

          if [ "${{ inputs.enable_license_scan }}" = "true" ]; then
            if [ "$TRIVY_INSTALL_OUTCOME" = "failure" ]; then
              add_row "Trivy license scan" "Enabled by input" "⏭️ Skipped" "Skipped because Trivy installation failed"
            else
              LICENSE_OUTCOME="${{ steps.license-scan.outcome }}"
              add_row "Trivy license scan" "Enabled by input" "$(to_result "$LICENSE_OUTCOME")" "Severity: UNKNOWN,HIGH,CRITICAL"
              mark_failure "$LICENSE_OUTCOME" "Trivy license scan"
            fi
          else
            add_row "Trivy license scan" "Enabled by input" "⏭️ Disabled" "enable_license_scan=false"
          fi

          echo "" >> "$GITHUB_STEP_SUMMARY"
          if [ "$FAILED" = "true" ]; then
            FAILED_JOINED="$(printf '%s, ' "${FAILED_SCANS[@]}")"
            FAILED_JOINED="${FAILED_JOINED%, }"
            echo "### ❌ Failed checks" >> "$GITHUB_STEP_SUMMARY"
            for scan in "${FAILED_SCANS[@]}"; do
              echo "- $scan" >> "$GITHUB_STEP_SUMMARY"
            done
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "Use the failed step logs above for detailed findings and remediation output." >> "$GITHUB_STEP_SUMMARY"
            echo "::error title=Security scan failures::$FAILED_JOINED"
            echo "failed=true" >> "$GITHUB_OUTPUT"
            echo "failed_scans=$FAILED_JOINED" >> "$GITHUB_OUTPUT"
          else
            echo "✅ All executed security checks passed." >> "$GITHUB_STEP_SUMMARY"
            echo "failed=false" >> "$GITHUB_OUTPUT"
            echo "failed_scans=" >> "$GITHUB_OUTPUT"
          fi

      - name: Fail job if security scans found issues
        if: steps.detect.outputs.any_changed == 'true' && always()
        run: |
          if [ "${{ steps.security-report.outputs.failed }}" = "true" ]; then
            echo "⚠️ Security scans found issues: ${{ steps.security-report.outputs.failed_scans }}"
            exit 1
          fi
          echo "✅ All security scans passed"

