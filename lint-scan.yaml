name: Lint

on:
  pull_request:
    branches: [main, staging]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  lint-scan:
    name: Lint Scan
    uses: calebsargeant/reusable-workflows/.github/workflows/lint-scan.yaml@v1.12.0
    with:
      job_timeout_minutes: 25
      fail_on_errors: true # Blocking mode: fail workflow when lint issues are found
